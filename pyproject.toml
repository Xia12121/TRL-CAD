[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trl-cad"
version = "0.1.0"
description = "Use TRL + PEFT to train open-source LLMs for OpenSCAD generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "datasets>=2.20.0",
  "trl>=0.13.0",
  "peft>=0.12.0",
  "accelerate>=0.33.0",
  "pyyaml>=6.0.2",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
  "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
