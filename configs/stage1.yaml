model_name: Qwen/Qwen2.5-1.5B-Instruct
dataset_path: data/samples/stage1_scad_corpus.jsonl
output_dir: outputs/stage1

# Weights & Biases monitoring
wb_project: trl-cad
wb_group: default-experiment
wb_notes: "Stage1 LM pretraining on SCAD corpus"

# Large dataset loading
streaming: false
cache_dir: null
keep_in_memory: false

max_seq_length: 1024
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
epochs: 2
logging_steps: 10
save_steps: 200
bf16: true
packing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
