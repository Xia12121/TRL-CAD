model_name: outputs/stage2
dataset_path: data/samples/stage3_grpo_prompts.jsonl
output_dir: outputs/stage3
require_peft_checkpoint: true

# Weights & Biases monitoring
wb_project: trl-cad
wb_group: default-experiment
wb_notes: "Stage3 GRPO + RLVR reinforcement learning"

# GRPO
batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 5.0e-6
grpo_epochs: 2
max_prompt_length: 512
max_new_tokens: 768
num_generations: 8
beta: 0.04
logging_steps: 10
save_steps: 200

# RLVR（简化三段奖励）
verify_with_openscad: true
openscad_bin: openscad
openscad_timeout_sec: 20

# 1) 编译 + 非空几何
compile_non_empty_reward: 1.2
compile_failure_penalty: -1.0
compile_empty_geometry_penalty: -1.2

# 2) 输出格式（是否有 CoT / <think>）
format_ok_reward: 0.3
format_missing_think_penalty: -0.3

# 3) 语义奖励（Stage2 prompt + scad 用 CLIP 方法训练的 BERT 双塔模型）
semantic_model_path: outputs/semantic_clip
require_semantic_model: true
semantic_similarity_weight: 1.0
semantic_unavailable_reward: 0.0
semantic_max_length: 256

# 大数据加载
streaming: false
cache_dir: null
keep_in_memory: false
num_proc: 4
load_from_cache_file: true

bf16: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
